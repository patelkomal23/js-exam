<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <title>Student Result</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
   <link rel="stylesheet" href="./style/style.css">
</head>
<body>
 <div class="container">
      <div id="signup">
         <h2>Signup</h2>
         <input type="text" id="signupstudentname" placeholder="Student Name" required>
         <input type="password" id="signupPassword" placeholder="Password" required>
         <button onclick="signup()">Signup</button>
         <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
      </div>

      <div id="login" class="hidden">
         <h2>Login</h2>
         <input type="text" id="loginstudentname" placeholder="Student Name" required>
         <input type="password" id="loginPassword" placeholder="Password" required>
         <button onclick="login()">Login</button>
         <p>Don't have an account? <a href="#" onclick="showSignup()">Signup</a></p>
      </div>

      <div id="result" class="hidden">
         <h2> Student Result Board</h2>
         <div class="Loading">Loading results...</div>
         <table>
            <thead>
               <tr>
                  <th>Student Name</th>
                  <th>Email</th>
                  <th>Result</th>
               </tr>
            </thead>
            <tbody></tbody>
         </table>
         <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
   </div>
   <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>
   <script src="./javascript/script.js"></script>
</body>
</html>
